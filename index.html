// 仓库同步数据（GitHub raw，CORS=*，无 Referer 限制）
async function fetchSyncData(){
  const res = await fetch(SYNC_URL, {signal: AbortSignal.timeout(30000)});
  if(!res.ok) throw new Error("sync http " + res.status);
  SYNC_DATA = await res.json();
  return SYNC_DATA;
}
// 腾讯批量行情（直连，CORS=*，无 Referer 限制）
async function fetchTXBatch(codes){
  const url = `https://qt.gtimg.cn/q=${codes.join(",")}`;
  const res = await fetch(url);
  const text = await res.text();
  const map = {};
  const re = /v_([a-zA-Z0-9_]+)="([^"]*)"/g;
  let m;
  while((m = re.exec(text)) !== null){
    const val = m[2];
    if(!val) continue;
    if(val.includes("~")){
      const parts = val.split("~");
      const tm = val.match(/~(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})~([\d.-]+)~([\d.-]+)~/);
      map[m[1]] = {price: parseFloat(parts[3]), chg: tm ? parseFloat(tm[3]) : NaN};
    }else{
      const parts = val.split(",");
      map[m[1]] = {price: parseFloat(parts[0]), chg: parseFloat(parts[1])};
    }
  }
  return map;
}

async function fetchTXHistory(code, sy, ey){
  const param = `${code},day,${sy}-01-01,${ey}-12-31,2000,qfq`;
  const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}`;
  const res = await fetch(url);
  const json = await res.json();
  if(json.data){
    const node = json.data[code] || json.data[Object.keys(json.data)[0]];
    if(!node) return null;
    let arr = null;
    for(const k of Object.keys(node)){
      if(Array.isArray(node[k]) && node[k].length){ arr = node[k]; break; }
    }
    if(arr && arr.length){
      const dates = [], values = [];
      for(const k of arr){
        dates.push(k[0]); values.push(parseFloat(k[2]));
      }
      return {dates, values};
    }
  }
  return null;
}
// 新浪全球期货日K（JSONP，2016年起全量）
function fetchSinaGlobalHist(symbol){
  return new Promise((resolve, reject) => {
    const cbName = "_hf" + symbol + "_" + Math.random().toString(36).slice(2,8);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ s.remove(); delete window[cbName]; reject(new Error("sina global timeout")); }, 15000);
    s.onload = () => {
      clearTimeout(timer); s.remove();
      const arr = window[cbName]; delete window[cbName];
      resolve(arr);
    };
    s.onerror = () => { clearTimeout(timer); s.remove(); delete window[cbName]; reject(new Error("sina global error")); };
    s.src = `https://stock.finance.sina.com.cn/futures/api/jsonp.php/var%20${cbName}=/GlobalFuturesService.getGlobalFuturesDailyKLine?symbol=${symbol}`;
    document.head.appendChild(s);
  }).then(arr => {
    if(!arr || !arr.length) return null;
    const dates = arr.map(o => o.date);
    const values = arr.map(o => parseFloat(o.close));
    return {dates, values};
  });
}
// ============ FRED 派生（yoy/mom，保留日期） ============
function deriveFRED(item, dates, values){
  if(item.yoy){
    const nd=[], nv=[];
    for(let i=12;i<values.length;i++){
      if(values[i-12] && values[i-12] !== 0){ nd.push(dates[i]); nv.push((values[i]/values[i-12]-1)*100); }
    }
    return {dates:nd, values:nv};
  }
  if(item.mom){
    const nd=[], nv=[];
    for(let i=1;i<values.length;i++){ nd.push(dates[i]); nv.push(values[i]-values[i-1]); }
    return {dates:nd, values:nv};
  }
  return {dates, values};
}
// ============ 周期聚合与年份过滤 ============
function filterYears(dates, values, sy, ey){
  const nd=[], nv=[];
  for(let i=0;i<dates.length;i++){
    const y = parseInt(dates[i].slice(0,4),10);
    if(!isNaN(y) && y>=sy && y<=ey){ nd.push(dates[i]); nv.push(values[i]); }
  }
  return {dates:nd, values:nv};
}
function aggregateSeries(dates, values, period){
  if(!dates || !dates.length) return {dates:[], values:[]};
  if(period === "day") return {dates, values};
  const nd=[], nv=[];
  if(period === "week"){
    for(let i=0;i<values.length;i+=5){
      const j = Math.min(i+4, values.length-1);
      nd.push(dates[j]); nv.push(values[j]);
    }
  }else{
    const keyLen = period === "month" ? 7 : 4;
    let lastKey = null;
    for(let i=0;i<dates.length;i++){
      const key = dates[i].slice(0,keyLen);
      if(lastKey !== null && key !== lastKey){ nd.push(dates[i-1]); nv.push(values[i-1]); }
      lastKey = key;
    }
    nd.push(dates[dates.length-1]); nv.push(values[values.length-1]);
  }
  return {dates:nd, values:nv};
}
function pctChg(values){
  if(!values || values.length < 2) return NaN;
  const a = values[values.length-2], b = values[values.length-1];
  if(!isFinite(a) || a === 0) return NaN;
  return (b/a - 1) * 100;
}
// X轴时间标签格式化（随周期变化）
function fmtAxisDate(d){
  if(!d) return "";
  if(curPeriod === "year") return d.slice(0,4);
  if(curPeriod === "month") return d.slice(0,7);
  return d.slice(5);
}

// ==================== 渲染层 ====================
const CAT_NAMES = {us_stock:"美股指数", global_index:"全球股指", commodity:"大宗商品", us_bond:"美债与利率", fx:"外汇汇率", us_macro:"美国宏观", cn_macro:"中国宏观", shipping:"航运物流"};

function renderCards(){
  gridEl.innerHTML = "";
  const list = currentCat === "all" ? indicatorList : indicatorList.filter(i=>i.cat===currentCat);
  list.forEach(item=>{
    const card = document.createElement('div');
    card.className = "card";
    card.id = `card-${item.id}`;
    card.innerHTML = `
      <div class="card-title"><span>${item.name}</span><span class="tag">${CAT_NAMES[item.cat]||""}</span></div>
      <div class="card-value" id="val-${item.id}">--</div>
      <div class="card-change" id="chg-${item.id}"></div>
      <div class="card-unit">${item.unit||""}</div>
      <div class="chart-box" id="chart-${item.id}"></div>
      <div class="card-src" id="src-${item.id}"></div>
    `;
    gridEl.appendChild(card);
  });
}

function updateCard(item, value, hist, meta={}){
  const cardEl = document.getElementById(`card-${item.id}`);
  if(!cardEl) return;
  const valEl = document.getElementById(`val-${item.id}`);
  let display = value;
  if(item.invert && value !== 0) display = 1/value;
  valEl.textContent = isFinite(display) ? display.toFixed(2) : "--";
  const chgEl = document.getElementById(`chg-${item.id}`);
  const chg = meta.chg;
  if(chg !== undefined && chg !== null && isFinite(chg)){
    chgEl.textContent = (chg>0?"+":"") + chg.toFixed(2) + "%";
    chgEl.className = "card-change " + (chg>0.05?"up":(chg<-0.05?"down":"flat"));
  }
  cardEl.classList.remove("red");
  const warnSpan = cardEl.querySelector(".card-warn");
  if(warnSpan) warnSpan.remove();
  const v = item.invert && value !== 0 ? 1/value : value;
  if(v < item.warnLow || v > item.warnHigh){
    cardEl.classList.add("red");
    const w = document.createElement('span');
    w.className = "card-warn";
    w.textContent = "超警戒";
    cardEl.appendChild(w);
  }
  const srcEl = document.getElementById(`src-${item.id}`);
  if(srcEl){
    const t = meta.time ? new Date(meta.time).toLocaleString('zh-CN',{hour12:false}) : "";
    srcEl.textContent = (meta.srcLabel? meta.srcLabel + " · " : "") + t;
  }
  const agg = hist && hist.dates ? aggregateSeries(hist.dates, hist.values, curPeriod) : null;
  drawChart(item, agg);
  indicatorData[item.id] = {value, hist};
}

function drawChart(item, agg){
  const chartDom = document.getElementById(`chart-${item.id}`);
  if(!chartDom) return;
  if(!agg || !agg.values || agg.values.length < 2){
    chartDom.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#4b5563;font-size:11px;">暂无历史数据源</div>';
    return;
  }
  if(chartInstances[item.id]) chartInstances[item.id].dispose();
  chartInstances[item.id] = echarts.init(chartDom);
  const labels = agg.dates.map(fmtAxisDate);
  const data = agg.values.map((v,i)=>[labels[i], v]);
  const up = agg.values[agg.values.length-1] >= agg.values[0];
  chartInstances[item.id].setOption({
    animation:false,
    tooltip:{trigger:'axis', formatter: params => {
      const p = params[0];
      const rawDate = agg.dates[p.dataIndex];
      return (rawDate||"") + "<br/>" + p.data[1].toFixed(2);
    }},
    grid:{top:6,right:4,bottom:18,left:38},
    xAxis:{type:'category', data: labels, axisLabel:{fontSize:8, color:'#64748b', interval: Math.max(0, Math.ceil(labels.length/8)-1)}, axisLine:{lineStyle:{color:'#333'}}},
    yAxis:{type:'value', scale:true, axisLabel:{fontSize:9, color:'#64748b'}, splitLine:{lineStyle:{color:'#262b31'}}},
    series:[{type:'line', data, smooth:true, symbol:'none',
      lineStyle:{width:1.4, color: up ? '#f87171' : '#34d399'},
      areaStyle:{color: up ? 'rgba(248,113,113,.12)' : 'rgba(52,211,153,.12)'}}]
  });
}

// ==================== 指标拉取 ====================
function fromSyncSeries(series){
  if(!SYNC_DATA) return null;
  if(SYNC_DATA.fred && SYNC_DATA.fred[series]) return SYNC_DATA.fred[series];
  if(SYNC_DATA.emdc && SYNC_DATA.emdc[series]) return SYNC_DATA.emdc[series];
  if(SYNC_DATA.fx && SYNC_DATA.fx[series]) return SYNC_DATA.fx[series];
  return null;
}

async function fetchOne(item){
  try{
    let result = null;
    if(item.src === "tx"){
      const map = await fetchTXBatch([item.code]);
      const d = map[item.code];
      if(d && isFinite(d.price)){
        let hist = null;
        try{
          if(item.hist === "tx") hist = await fetchTXHistory(item.histCode, startY, endY);
          else if(item.hist === "sina") hist = await fetchSinaGlobalHist(item.histSymbol);
          else if(item.hist === "sync"){
            const s = fromSyncSeries(item.syncSeries);
            if(s && s.dates) hist = {dates: s.dates, values: s.values};
          }
        }catch(e){}
        result = {value: d.price, hist, chg: d.chg};
      }
    } else if(item.src === "sync"){
      const raw = fromSyncSeries(item.syncSeries);
      if(raw){
        if(item.kind === "fx"){
          result = {value: raw.value, hist: null, chg: raw.chg};
        }else if(raw.dates && raw.values.length){
          let dates = raw.dates, values = raw.values;
          if(item.div) values = values.map(x=>x/item.div);
          const derived = deriveFRED(item, dates, values);
          if(derived.values.length){
            result = {value: derived.values[derived.values.length-1], hist: derived, chg: pctChg(derived.values)};
          }
        }
      }
    }
    if(result && isFinite(result.value)){
      if(result.hist && result.hist.dates){
        result.hist = filterYears(result.hist.dates, result.hist.values, startY, endY);
      }
      return result;
    }
    log(`${item.name} 暂无数据`, "error");
    return null;
  }catch(err){
    log(`${item.name} 请求异常: ${err.message}`, "error");
    return null;
  }
}

const PERIOD_NAMES = {day:"日K", week:"周K", month:"月K", year:"年K"};
function periodName(p){ return PERIOD_NAMES[p] || p; }

function srcLabelOf(item){
  if(item.src === "tx") return "腾讯行情";
  if(item.src === "sync"){
    if(item.kind === "fx") return "新浪外汇";
    if(SYNC_DATA && SYNC_DATA.fred && SYNC_DATA.fred[item.syncSeries]) return "FRED";
    return "东方财富";
  }
  return "";
}
function srcTimeOf(item){
  if(item.src === "sync"){
    if(item.kind === "fx"){ const r = fromSyncSeries(item.syncSeries); return r && r.time ? r.time : null; }
    const r = fromSyncSeries(item.syncSeries);
    if(r && r.dates && r.dates.length) return new Date(r.dates[r.dates.length-1]).getTime();
  }
  return Date.now();
}

// 高频行情刷新（腾讯实时，批量并行）
async function refreshHighFreq(){
  if(isRunning){ log("任务执行中，禁止重复启动", "warn"); return; }
  isRunning = true;
  setStatus("正在拉取高频行情…");
  try{
    log(`===== 刷新【高频行情】（${startY}-${endY}，${periodName(curPeriod)}） =====`, "success");
    const highList = indicatorList.filter(i=>i.highFreq);
    const batchSize = 6;
    for(let i=0;i<highList.length;i+=batchSize){
      if(!isRunning) break;
      const batch = highList.slice(i, i+batchSize);
      const results = await Promise.all(batch.map(item => fetchOne(item)));
      batch.forEach((item, j) => {
        const res = results[j];
        if(res){
          cache.set(item.id, {...res, time: Date.now(), srcLabel: srcLabelOf(item)});
          updateCard(item, res.value, res.hist, {chg: res.chg, srcLabel: srcLabelOf(item), time: Date.now()});
          const disp = item.invert && res.value !== 0 ? 1/res.value : res.value;
          log(`${item.name}: ${disp.toFixed(2)}${item.unit||""}`, "success");
        }
      });
      await sleep(300);
    }
    log("高频行情刷新完成", "success");
  }finally{
    isRunning = false;
    setStatus(autoRefreshTimer ? "空闲｜自动刷新开启" : "空闲");
  }
}

// 宏观数据刷新（全部来自仓库同步数据，本地即时渲染）
async function refreshLowFreq(){
  if(isRunning){ log("任务执行中，禁止重复启动", "warn"); return; }
  isRunning = true;
  setStatus("正在同步宏观数据…");
  try{
    log(`===== 重新加载【宏观数据】（${startY}-${endY}） =====`, "success");
    try{
      await fetchSyncData();
      log("仓库同步数据获取成功", "success");
    }catch(e){
      log("仓库同步数据获取失败: " + e.message, "error");
      if(SYNC_DATA) log("使用上一次已加载数据", "warn");
    }
    const lowList = indicatorList.filter(i=>!i.highFreq);
    for(const item of lowList){
      if(!isRunning) break;
      const cacheItem = cache.get(item.id);
      if(cacheItem && (Date.now() - cacheItem.time) < 10 * 60 * 1000){
        updateCard(item, cacheItem.value, cacheItem.hist, {chg:cacheItem.chg, srcLabel: cacheItem.srcLabel, time: cacheItem.time});
        continue;
      }
      const res = await fetchOne(item);
      if(res){
        const meta = {srcLabel: srcLabelOf(item), time: srcTimeOf(item), chg: res.chg};
        cache.set(item.id, {...res, time: Date.now(), srcLabel: srcLabelOf(item)});
        updateCard(item, res.value, res.hist, meta);
        const disp = item.invert && res.value !== 0 ? 1/res.value : res.value;
        log(`${item.name}: ${disp.toFixed(2)}${item.unit||""}`, "success");
      }
      await sleep(60);
    }
    log("宏观数据加载完成", "success");
  }finally{
    isRunning = false;
    setStatus(autoRefreshTimer ? "空闲｜自动刷新开启" : "空闲");
  }
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

    document.getElementById("toggleAutoRefresh").className = "btn btn-auto on";
    setStatus("空闲｜自动刷新：开启");

});
document.getElementById("refreshHighFreq").addEventListener("click", refreshHighFreq);
document.getElementById("refreshAllLowFreq").addEventListener("click", refreshLowFreq);

document.getElementById("chipBar").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");

      const cacheItem = cache.get(item.id);
      updateCard(item, d.value, d.hist, {chg: cacheItem&&cacheItem.chg, srcLabel: cacheItem&&cacheItem.srcLabel, time: cacheItem&&cacheItem.time});
    }
  });
});

// ==================== 周期 / 年份范围控制 ====================
function redrawAll(){
  indicatorList.forEach(item=>{
    const d = indicatorData[item.id];
    if(d){
      const cacheItem = cache.get(item.id);
      updateCard(item, d.value, d.hist, {chg: cacheItem&&cacheItem.chg, srcLabel: cacheItem&&cacheItem.srcLabel, time: cacheItem&&cacheItem.time});
    }
  });
}
function updateRangeHint(){
  const el = document.getElementById("rangeHint");
  if(el) el.textContent = `当前范围：${startY} 年 ~ ${endY} 年 · ${periodName(curPeriod)}`;
}

// ==================== 初始化 ====================
window.onload = async function(){
  const sySel = document.getElementById("startYear"), eySel = document.getElementById("endYear");
  for(let y=1990; y<=NOW_YEAR; y++){
    const o1 = document.createElement('option'); o1.value = y; o1.textContent = y;
    const o2 = document.createElement('option'); o2.value = y; o2.textContent = y;
    sySel.appendChild(o1); eySel.appendChild(o2);
  }
  sySel.value = String(startY); eySel.value = String(endY);
  updateRangeHint();
  document.getElementById("periodGroup").addEventListener("click", (e)=>{
    const btn = e.target.closest(".period-btn");
    if(!btn) return;
    document.querySelectorAll(".period-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    curPeriod = btn.dataset.period;
    log(`切换周期为 ${periodName(curPeriod)}，本地重绘全部图表`, "info");
    updateRangeHint();
    redrawAll();
  });
  document.getElementById("applyRange").addEventListener("click", ()=>{
    const sy = parseInt(sySel.value,10), ey = parseInt(eySel.value,10);
    if(!sy || !ey || sy > ey){ log("年份范围无效：开始年份需 ≤ 结束年份", "error"); return; }
    if(sy === startY && ey === endY){ log("年份范围未变化", "warn"); return; }
    startY = sy; endY = ey;
    updateRangeHint();
    cache.clear();
    log(`应用时间范围 ${startY}-${endY}，清空缓存并重新加载`, "warn");
    refreshHighFreq().then(()=>refreshLowFreq());
  });
  renderCards();
  log("54项指标看板加载完成，开始加载宏观数据", "success");
  await refreshLowFreq();
  log("宏观数据已加载，继续刷新高频行情", "info");
  await refreshHighFreq();
  log("全部指标加载完成", "success");
};
