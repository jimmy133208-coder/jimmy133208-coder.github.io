// ==================== 数据获取层 ====================
// 东方财富 push2 批量行情（直连，CORS=*）
async function fetchEMBatch(secids){
  const url = `https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=${secids.join(",")}&fields=f2,f3,f4,f12,f13,f14`;
  const res = await fetch(url);
  const json = await res.json();
  const map = {};
  if(json.data && json.data.diff){
    for(const d of json.data.diff){
      const v = {price: d.f2, chg: d.f3};
      map[d.f12] = v;
      if(d.f13 !== undefined) map[`${d.f13}.${d.f12}`] = v;
    }
  }
  return map;
}
// 东方财富 push2his 历史K线（直连）
async function fetchEMHistory(secid, len=HIST_LEN){
  const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&klt=101&fqt=1&lmt=${len}&end=20500101&fields1=f1,f2,f3&fields2=f51,f52,f53`;
  const res = await fetch(url);
  const json = await res.json();
  if(json.data && json.data.klines){
    return json.data.klines.map(k => parseFloat(k.split(",")[2]));
  }
  return [];
}
// 腾讯批量行情（直连，CORS=*）
async function fetchTXBatch(codes){
  const url = `https://qt.gtimg.cn/q=${codes.join(",")}`;
  const res = await fetch(url);
  const text = await res.text();
  const map = {};
  const re = /v_([a-zA-Z0-9_]+)="([^"]*)"/g;
  let m;
  while((m = re.exec(text)) !== null){
    const val = m[2];
    if(!val) continue;
    if(val.includes("~")){
      // 指数格式：~ 分隔；涨跌幅位于时间戳后第二字段（~日期~涨跌额~涨跌幅~）
      const parts = val.split("~");
      const tm = val.match(/~(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})~([\d.-]+)~([\d.-]+)~/);
      map[m[1]] = {price: parseFloat(parts[3]), chg: tm ? parseFloat(tm[3]) : NaN};
    }else{
      // 商品格式：, 分隔
      const parts = val.split(",");
      map[m[1]] = {price: parseFloat(parts[0]), chg: parseFloat(parts[1])};
    }
  }
  return map;
}
// 腾讯历史K线（直连）
async function fetchTXHistory(code, len=HIST_LEN){
  const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${code},day,,,${len},qfq`;
  const res = await fetch(url);
  const json = await res.json();
  const node = json.data[code];
  const arr = node && (node.day || node.qfqday);
  if(arr && arr.length){
    return arr.map(k => parseFloat(k[2]));
  }
  return [];
}
// FRED 系列（经 CORS 代理），yoy/mom 计算；返回 {value, history}
async function fetchFREDSeries(series, len=HIST_LEN+13){
  const base = `https://api.stlouisfed.org/fred/series/observations?series_id=${series}&api_key=3bfcf47458e7e97a5a4ad69174d28fe0&file_type=json&sort_order=desc&limit=${len}`;
  let json = null;
  for(const proxy of [CORS_PROXY, CORS_PROXY2]){
    try{
      const res = await fetch(proxy + encodeURIComponent(base), {signal: AbortSignal.timeout(20000)});
      json = await res.json();
      if(json && json.observations) break;
    }catch(e){ /* 换下一个代理 */ }
  }
  if(!json || !json.observations || !json.observations.length) return null;
  const obs = json.observations.slice().reverse().map(o => parseFloat(o.value));
  const valid = obs.filter(v => !isNaN(v));
  if(!valid.length) return null;
  return {value: valid[valid.length-1], history: valid};
}
// 东方财富数据中心 JSONP（script 标签直连，无需代理）
function fetchEMDC(cfg){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2,10);
    const params = new URLSearchParams({
      reportName: cfg.reportName,
      columns: "ALL",
      pageSize: String(cfg.len || HIST_LEN),
      pageNumber: "1",
      sortColumns: "REPORT_DATE",
      sortTypes: "-1",
      source: "WEB",
      client: "WEB",
      p: "1",
      pageNo: "1",
      pageNum: "1"
    });
    if(cfg.filter) params.set("filter", cfg.filter);
    params.set("callback", cb);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ s.remove(); delete window[cb]; reject(new Error("emdc timeout")); }, 15000);
    window[cb] = (data) => {
      clearTimeout(timer); s.remove(); delete window[cb];
      resolve(data);
    };
    s.onerror = () => { clearTimeout(timer); s.remove(); delete window[cb]; reject(new Error("emdc script error")); };
    s.src = `https://datacenter-web.eastmoney.com/api/data/v1/get?${params.toString()}`;
    document.head.appendChild(s);
  });
}
// 新浪宏观 JSONP（货运/港口）
function fetchSinaMacro(){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2,10);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ s.remove(); delete window[cb]; reject(new Error("sina timeout")); }, 15000);
    window[cb] = (data) => {
      clearTimeout(timer); s.remove(); delete window[cb];
      resolve(data);
    };
    s.onerror = () => { clearTimeout(timer); s.remove(); delete window[cb]; reject(new Error("sina script error")); };
    s.src = `https://quotes.sina.cn/mac/api/jsonp_v3.php/${cb}/MacPage_Service.get_pagedata?cate=industry&event=10&from=0&num=1&condition=`;
    document.head.appendChild(s);
  });
}
// ============ 处理 FRED 派生指标（yoy/mom） ============
function deriveFRED(item, series){
  if(!series || series.length < 2) return series;
  if(item.yoy){
    // 同比：当前值 / 12期前 - 1
    return series.map((v,i) => (i>=12 && series[i-12]!==0) ? (v/series[i-12]-1)*100 : NaN).filter(v=>!isNaN(v));
  }
  if(item.mom){
    // 月环比（非农：千人）
    return series.map((v,i) => i>=1 ? (v-series[i-1]) : NaN).filter(v=>!isNaN(v));
  }
  return series;
}

// ==================== 渲染层 ====================
const CAT_NAMES = {us_stock:"美股指数", us_bond:"美债与利率", fx:"外汇汇率", commodity:"大宗商品", global_index:"全球股指", us_macro:"美国宏观", cn_macro:"中国宏观", shipping:"航运物流"};

function renderCards(){
  gridEl.innerHTML = "";
  const list = currentCat === "all" ? indicatorList : indicatorList.filter(i=>i.cat===currentCat);
  list.forEach(item=>{
    const card = document.createElement('div');
    card.className = "card";
    card.id = `card-${item.id}`;
    card.innerHTML = `
      <div class="card-title"><span>${item.name}</span><span class="tag">${CAT_NAMES[item.cat]||""}</span></div>
      <div class="card-value" id="val-${item.id}">--</div>
      <div class="card-change" id="chg-${item.id}"></div>
      <div class="card-unit">${item.unit||""}</div>
      <div class="chart-box" id="chart-${item.id}"></div>
      <div class="card-src" id="src-${item.id}"></div>
    `;
    gridEl.appendChild(card);
  });
}

function updateCard(item, value, history=[], meta={}){
  const cardEl = document.getElementById(`card-${item.id}`);
  if(!cardEl) return;
  const valEl = document.getElementById(`val-${item.id}`);
  let display = value;
  if(item.invert && value !== 0) display = 1/value;
  valEl.textContent = isFinite(display) ? display.toFixed(2) : "--";
  const chgEl = document.getElementById(`chg-${item.id}`);
  if(meta.chg !== undefined && isFinite(meta.chg)){
    chgEl.textContent = (meta.chg>0?"+":"") + meta.chg.toFixed(2) + "%";
    chgEl.className = "card-change " + (meta.chg>0.05?"up":(meta.chg<-0.05?"down":"flat"));
  }
  // 阈值告警
  cardEl.classList.remove("red");
  const warnSpan = cardEl.querySelector(".card-warn");
  if(warnSpan) warnSpan.remove();
  const v = item.invert && value !== 0 ? 1/value : value;
  if(v < item.warnLow || v > item.warnHigh){
    cardEl.classList.add("red");
    const w = document.createElement('span');
    w.className = "card-warn";
    w.textContent = "超警戒";
    cardEl.appendChild(w);
  }
  // 来源与时间
  const srcEl = document.getElementById(`src-${item.id}`);
  if(srcEl){
    const t = meta.time ? new Date(meta.time).toLocaleString('zh-CN',{hour12:false}) : "";
    srcEl.textContent = (meta.srcLabel? meta.srcLabel + " · " : "") + t;
  }
  // 迷你图
  drawChart(item, history);
  indicatorData[item.id] = {value, history};
}

function drawChart(item, history){
  const chartDom = document.getElementById(`chart-${item.id}`);
  if(!chartDom || !history || history.length < 2) return;
  if(chartInstances[item.id]) chartInstances[item.id].dispose();
  chartInstances[item.id] = echarts.init(chartDom);
  const up = history[history.length-1] >= history[0];
  chartInstances[item.id].setOption({
    animation:false,
    tooltip:{trigger:'axis', formatter: params => {
      const p = params[0];
      return p.data[0] + "<br/>" + p.data[1].toFixed(2);
    }},
    grid:{top:6,right:4,bottom:18,left:38},
    xAxis:{type:'category', data: history.map((_,i)=>i), axisLabel:{show:false}, axisLine:{lineStyle:{color:'#333'}}},
    yAxis:{type:'value', scale:true, axisLabel:{fontSize:9, color:'#64748b'}, splitLine:{lineStyle:{color:'#262b31'}}},
    series:[{type:'line', data: history, smooth:true, symbol:'none',
      lineStyle:{width:1.4, color: up ? '#f87171' : '#34d399'},
      areaStyle:{color: up ? 'rgba(248,113,113,.12)' : 'rgba(52,211,153,.12)'}}]
  });
}

// ==================== 指标拉取 ====================
async function fetchOne(item){
  try{
    let result = null;
    if(item.src === "em"){
      const map = await fetchEMBatch([item.secid]);
      const d = map[item.secid];
      if(d && isFinite(d.price)){
        let hist = [];
        try{ hist = await fetchEMHistory(item.secid); }catch(e){}
        result = {value: d.price, history: hist.length?hist:[d.price], chg: d.chg};
      }
    } else if(item.src === "tx"){
      const map = await fetchTXBatch([item.code]);
      const d = map[item.code];
      if(d && isFinite(d.price)){
        let hist = [];
        try{ hist = await fetchTXHistory(item.code); }catch(e){}
        result = {value: d.price, history: hist.length?hist:[d.price], chg: d.chg};
      }
    } else if(item.src === "fred"){
      const raw = await fetchFREDSeries(item.series);
      if(raw){
        const series = deriveFRED(item, raw.history);
        const value = series[series.length-1];
        result = {value, history: series};
      }
    } else if(item.src === "emdc"){
      const data = await fetchEMDC({reportName: item.reportName, filter: item.filter});
      if(data && data.result && data.result.data && data.result.data.length){
        const rows = data.result.data;
        const hist = rows.slice().reverse().map(r => parseFloat(r[item.field])).filter(v=>!isNaN(v));
        if(hist.length) result = {value: hist[hist.length-1], history: hist};
      }
    } else if(item.src === "sina"){
      const data = await fetchSinaMacro();
      if(data && data.data && data.data["非累计"] && data.data["非累计"].length){
        const row = data.data["非累计"][0];
        // 字段下标：2=货运量(亿吨) 10=沿海主要港口货物吞吐量(亿吨)
        const idx = item.field === "freight" ? 2 : 10;
        const val = parseFloat(row[idx]);
        if(isFinite(val)) result = {value: val, history: [val]};
      }
    }
    if(result && isFinite(result.value)){
      return result;
    }
    log(`${item.name} 暂无数据`, "error");
    return null;
  }catch(err){
    log(`${item.name} 请求异常: ${err.message}`, "error");
    return null;
  }
}

// 高频行情刷新（批量并行）
async function refreshHighFreq(){
  if(isRunning){ log("任务执行中，禁止重复启动", "warn"); return; }
  isRunning = true;
  setStatus("正在拉取高频行情…");
  log("===== 刷新【高频行情】（东方财富/腾讯直连，FRED经代理） =====", "success");
  const highList = indicatorList.filter(i=>i.highFreq);
  // 并发拉取（每批 6 个）
  const batchSize = 6;
  for(let i=0;i<highList.length;i+=batchSize){
    if(!isRunning) break;
    const batch = highList.slice(i, i+batchSize);
    const results = await Promise.all(batch.map(item => fetchOne(item)));
    batch.forEach((item, j) => {
      const res = results[j];
      if(res){
        cache.set(item.id, {...res, time: Date.now(), srcLabel: srcLabelOf(item)});
        updateCard(item, res.value, res.history, {chg: res.chg, srcLabel: srcLabelOf(item), time: Date.now()});
        log(`${item.name}: ${res.value.toFixed(2)}${item.unit||""}`, "success");
      }
    });
    await sleep(300);
  }
  log("高频行情刷新完成", "success");
  isRunning = false;
  setStatus(autoRefreshTimer ? "空闲｜自动刷新开启" : "空闲");
}

function srcLabelOf(item){
  if(item.src === "em") return "东方财富";
  if(item.src === "tx") return "腾讯行情";
  if(item.src === "fred") return "FRED";
  if(item.src === "emdc") return "东方财富宏观";
  if(item.src === "sina") return "新浪宏观";
  return "";
}

// 低频宏观刷新（FRED 走代理串行，中国宏观 JSONP 并行）
async function refreshLowFreq(){
  if(isRunning){ log("任务执行中，禁止重复启动", "warn"); return; }
  isRunning = true;
  setStatus("正在拉取低频宏观…");
  log("===== 加载【低频宏观】（FRED / 东方财富宏观 / 新浪宏观） =====", "success");
  const lowList = indicatorList.filter(i=>!i.highFreq);
  for(const item of lowList){
    if(!isRunning) break;
    const cacheItem = cache.get(item.id);
    if(cacheItem && (Date.now() - cacheItem.time) < CACHE_LOW_TTL){
      updateCard(item, cacheItem.value, cacheItem.history, {chg:cacheItem.chg, srcLabel: cacheItem.srcLabel, time: cacheItem.time});
      log(`${item.name} 使用缓存`, "info");
      continue;
    }
    const res = await fetchOne(item);
    if(res){
      const meta = {srcLabel: srcLabelOf(item), time: Date.now(), chg: res.chg};
      cache.set(item.id, {...res, time: Date.now(), srcLabel: srcLabelOf(item)});
      updateCard(item, res.value, res.history, meta);
      log(`${item.name}: ${res.value.toFixed(2)}${item.unit||""}`, "success");
    }
    await sleep(150);
  }
  log("低频宏观加载完成（缓存60分钟）", "success");
  isRunning = false;
  setStatus(autoRefreshTimer ? "空闲｜自动刷新开启" : "空闲");
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// 分类筛选
document.getElementById("chipBar").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  currentCat = chip.dataset.cat;
  renderCards();
  // 重绘已加载的卡片
  indicatorList.filter(i=>currentCat==="all"||i.cat===currentCat).forEach(item=>{
    const d = indicatorData[item.id];
    if(d){
      const cacheItem = cache.get(item.id);
      updateCard(item, d.value, d.history, {chg: cacheItem&&cacheItem.chg, srcLabel: cacheItem&&cacheItem.srcLabel, time: cacheItem&&cacheItem.time});
    }
  });
});
